<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>La Posta Bar · Administración</title>
<style>
:root{color-scheme:dark;--bg:#0b1016;--panel:#121b24;--line:#263440;--muted:#93a6b5;--cyan:#4aead6;--pink:#ff58b5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#ecf3f7;font:15px 'Segoe UI',sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:#1b2935;color:#ecf3f7;padding:11px 16px}button:hover{border-color:var(--cyan)}button.primary{background:var(--cyan);color:#082822;font-weight:700}button.danger{color:#ff98ac}button:disabled{opacity:.4;cursor:not-allowed}input,select{width:100%;padding:12px;background:#0c141d;color:#fff;border:1px solid #344553;border-radius:8px}label{display:block;margin:14px 0 6px;color:var(--muted)}aside{position:fixed;inset:0 auto 0 0;width:230px;border-right:1px solid var(--line);padding:32px 20px;background:#0d151d} .logo{font-size:28px;letter-spacing:3px;color:#e1fff9;text-shadow:0 0 8px #29e4ca,0 0 24px #16b29c;font-weight:800}.bar{color:var(--pink);letter-spacing:9px;font-size:14px;margin:5px 0 46px;text-shadow:0 0 13px #ff389d}nav button{display:block;width:100%;text-align:left;margin:8px 0;border-color:transparent;background:transparent;color:var(--muted)}nav button.active{background:#18322f;color:var(--cyan);border-color:#28544e}.offline{position:absolute;bottom:25px;color:var(--muted);font-size:12px;line-height:1.8}main{margin-left:230px;padding:32px 40px;max-width:1660px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--cyan);text-transform:uppercase}h1{font-size:30px;margin:8px 0}h2{font-size:19px;margin:0 0 18px}p{color:var(--muted);line-height:1.6}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}.card small{color:var(--muted)}.value{font-size:27px;font-weight:650;margin-top:13px}.cyan{color:var(--cyan)}.pink{color:var(--pink)}.tables{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.table{min-height:157px;text-align:left;padding:20px;background:linear-gradient(140deg,#14202a,#111a23);border-radius:13px}.table.busy{border-color:#447b70;background:linear-gradient(140deg,#18372f,#12231f)}.table strong{display:block;font-size:20px;margin:19px 0 10px}.badge{font-size:11px;padding:5px 8px;border-radius:5px;background:#243441;color:#b3c2cb;letter-spacing:1px}.busy .badge{color:var(--cyan);background:#235043}.table span:last-child{display:block;color:var(--muted)}.split{display:grid;grid-template-columns:1.35fr 1fr;gap:22px}.list{width:100%;border-collapse:collapse}.list th{text-align:left;color:var(--muted);font-size:12px;font-weight:500}.list td,.list th{padding:13px 8px;border-bottom:1px solid var(--line)}.right{text-align:right!important}.empty{padding:32px;text-align:center;color:var(--muted)}.products{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:15px}.products button{text-align:left;padding:16px}.products b{display:block;color:var(--cyan);margin-top:8px}.total{font-size:27px;font-weight:700}.sub{font-size:12px;color:var(--muted)}dialog{background:var(--panel);color:#fff;border:1px solid #415965;border-radius:16px;width:470px;max-width:95vw;padding:26px}dialog::backdrop{background:#000b;backdrop-filter:blur(4px)}dialog .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:25px}.notice{padding:14px 17px;border:1px solid #315448;background:#152b23;color:#b9e4d1;border-radius:9px;margin:18px 0}.toast{position:fixed;bottom:25px;right:25px;padding:17px 24px;background:#235043;border:1px solid var(--cyan);border-radius:10px;z-index:50;max-width:85vw}.footer{margin-top:28px;font-size:12px;color:var(--muted)}a{color:var(--cyan)}@media(max-width:1000px){aside{width:185px}main{margin-left:185px;padding:24px}.tables,.cards{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}@media(max-width:620px){aside{position:static;width:auto;padding:18px}.logo{font-size:22px}.bar{margin-bottom:14px}nav{display:flex;overflow:auto}nav button{white-space:nowrap;width:auto}.offline{display:none}main{margin:0;padding:18px}.top{align-items:flex-start}.value{font-size:22px}.cards{gap:9px}.card{padding:16px}.tables{gap:10px}.top .sub{display:none}}@media print{aside,button,.footer{display:none!important}main{margin:0;padding:0}body{background:white;color:black}.panel,.card{background:white;color:black}.list td{color:black}}
</style>
<aside><div class="logo">LA POSTA</div><div class="bar">BAR</div><nav id="nav"></nav><div class="offline">● Sin conexión · Datos locales<br>Administración del bar · v1.0</div></aside><main id="app"></main><dialog id="modal"></dialog><div id="toast" hidden class="toast"></div>
<script>
'use strict';
const KEY='laposta.bar.v1';const $=s=>document.querySelector(s);const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:2}).format(n/100);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=s=>new Date(s).toLocaleString('es-AR');const now=()=>new Date().toISOString();
const initial=()=>({version:1,products:[{id:uid(),name:'Cerveza tirada',category:'Bebidas',price:350000,active:true},{id:uid(),name:'Fernet con cola',category:'Tragos',price:500000,active:true},{id:uid(),name:'Gin tonic',category:'Tragos',price:550000,active:true},{id:uid(),name:'Gaseosa',category:'Bebidas',price:200000,active:true},{id:uid(),name:'Papas de la casa',category:'Cocina',price:650000,active:true},{id:uid(),name:'Hamburguesa completa',category:'Cocina',price:800000,active:true}],methods:[{id:uid(),name:'Efectivo',cash:true,active:true},{id:uid(),name:'Transferencia',cash:false,active:true},{id:uid(),name:'Tarjeta',cash:false,active:true},{id:uid(),name:'Mercado Pago',cash:false,active:true}],tables:Array.from({length:12},(_,i)=>({id:uid(),name:'Mesa '+String(i+1).padStart(2,'0'),items:[],opened:null})),shift:null,movements:[],closings:[]});
let state;try{const raw=localStorage.getItem(KEY);state=raw?JSON.parse(raw):initial()}catch(e){document.body.innerHTML='<p>No se pudieron leer los datos. Conservá este navegador y recuperá una copia antes de continuar.</p>';throw e}let view='Mesas',selected=null,search='';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('No se pudieron guardar los cambios. Exportá una copia de seguridad inmediatamente. '+e.message);return false}}function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,3300)}function total(t){return t.items.reduce((a,i)=>a+i.price*i.qty,0)}function shiftMoves(){return state.shift?state.movements.filter(m=>m.shiftId===state.shift.id):[]}function sums(ms){let income=0,expense=0,cash=0,sales=0;ms.forEach(m=>{const sign=m.type==='expense'?-1:1;if(sign>0)income+=m.amount;else expense+=m.amount;if(m.cash)cash+=sign*m.amount;if(m.type==='sale')sales+=m.amount});return {income,expense,cash,sales}}function go(v){view=v;selected=null;search='';render()}function openModal(title,body,submit){$('#modal').innerHTML=`<form id="form"><h2>${title}</h2>${body}<div class="actions"><button type="button" onclick="document.querySelector('dialog').close()">Cancelar</button><button class="primary" type="submit">Confirmar</button></div></form>`;$('#form').onsubmit=e=>{e.preventDefault();try{if(submit(new FormData(e.target))!==false)$('#modal').close()}catch(err){alert(err.message)}};$('#modal').showModal()}function amount(v,zero=false){const n=Number(String(v).replace(',','.'));if(!Number.isFinite(n)||n<0||(!zero&&n===0)||n>1e10)throw Error('Ingresá un importe válido.');return Math.round(n*100)}function field(label,name,value='',type='text'){return `<label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" required ${type==='number'?'min="0" step="0.01"':''}>`}function methodOptions(){return state.methods.filter(m=>m.active).map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}function requireShift(){if(!state.shift){alert('Primero abrí la caja desde la sección Caja.');return false}return true}
function render(){const tabs=['Mesas','Caja','Productos','Formas de pago','Reportes','Ajustes'];$('#nav').innerHTML=tabs.map((v,i)=>`<button class="${view===v?'active':''}" onclick="go('${v}')">${['▦','◈','▤','▱','▥','⚙'][i]} &nbsp; ${v}</button>`).join('');const titles={Mesas:'El salón, a tu ritmo',Caja:'Control de caja',Productos:'Tu carta', 'Formas de pago':'Cómo te pagan',Reportes:'Los números del bar',Ajustes:'Todo en su lugar'};$('#app').innerHTML=`<div class="top"><div><div class="eyebrow">LA POSTA BAR / ${view}</div><h1>${titles[view]}</h1><div class="sub">${new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div></div><span class="badge">${state.shift?'● CAJA ABIERTA':'○ CAJA CERRADA'}</span></div><div id="content"></div><div class="footer">Guardado local automático · Hacé una copia de seguridad al finalizar cada jornada.</div>`;({Mesas:renderTables,Caja:renderCash,Productos:renderProducts,'Formas de pago':renderMethods,Reportes:renderReports,Ajustes:renderSettings}[view])()}
function renderTables(){const busy=state.tables.filter(t=>t.items.length);const s=sums(shiftMoves());$('#content').innerHTML=`<div class="cards"><div class="card"><small>Mesas ocupadas</small><div class="value">${busy.length} <span class="sub">/ ${state.tables.length}</span></div></div><div class="card"><small>Consumos pendientes</small><div class="value pink">${money(busy.reduce((a,t)=>a+total(t),0))}</div></div><div class="card"><small>Ventas de la caja actual</small><div class="value cyan">${money(s.sales)}</div></div><div class="card"><small>Mesas libres</small><div class="value">${state.tables.length-busy.length}</div></div></div>${selected?'':`<div class="row between" style="margin-bottom:20px"><h2>Mapa de mesas <span class="sub">· Seleccioná una para cargar consumos</span></h2><button onclick="addTable()">＋ Agregar mesa</button></div>`}<div id="salon"></div>`;if(selected){renderOrder();return}$('#salon').innerHTML=`<div class="tables">${state.tables.map(t=>`<button class="table ${t.items.length?'busy':''}" onclick="selectTable('${t.id}')"><span class="badge">${t.items.length?'OCUPADA':'LIBRE'}</span><strong>${esc(t.name)}</strong><span>${t.items.length?money(total(t))+' · '+t.items.reduce((a,i)=>a+i.qty,0)+' productos':'Lista para recibir'}</span></button>`).join('')}</div>`}
function selectTable(id){selected=id;search='';renderTables()}function renderOrder(){const t=state.tables.find(t=>t.id===selected);$('#salon').innerHTML=`<div class="row between" style="margin-bottom:18px"><button onclick="selected=null;renderTables()">← Volver al salón</button><h2>${esc(t.name)}</h2><button class="danger" onclick="cancelOrder()">Cancelar consumos</button></div><div class="split"><div class="panel"><h2>Agregar a la mesa</h2><input id="search" placeholder="Buscar producto o categoría…" value="${esc(search)}" oninput="search=this.value;renderProductButtons()"><div id="buttons" class="products"></div></div><div class="panel"><h2>Cuenta de la mesa</h2>${t.items.length?`<table class="list">${t.items.map((i,n)=>`<tr><td>${esc(i.name)}<div class="sub">${money(i.price)} c/u</div></td><td class="right"><button onclick="qty(${n},-1)">−</button> ${i.qty} <button onclick="qty(${n},1)">＋</button></td><td class="right">${money(i.price*i.qty)}</td></tr>`).join('')}</table>`:'<div class="empty">La primera ronda empieza acá.<br>Elegí un producto de la carta.</div>'}<div class="row between" style="margin:24px 0"><span>Total</span><span class="total cyan">${money(total(t))}</span></div><div class="row"><button class="primary" ${t.items.length?'':'disabled'} onclick="checkout()">Cobrar y liberar mesa</button><button ${t.items.length?'':'disabled'} onclick="printOrder()">Imprimir cuenta</button></div><p class="sub">Los consumos se registran como ingreso al cobrarlos.</p></div></div>`;renderProductButtons()}
function renderProductButtons(){$('#buttons').innerHTML=state.products.filter(p=>p.active&&(p.name+' '+p.category).toLowerCase().includes(search.toLowerCase())).map(p=>`<button onclick="addItem('${p.id}')">${esc(p.name)}<div class="sub">${esc(p.category)}</div><b>${money(p.price)} ＋</b></button>`).join('')||'<p>No hay productos para mostrar.</p>'}
function addItem(id){if(!requireShift())return;const t=state.tables.find(t=>t.id===selected),p=state.products.find(p=>p.id===id);let item=t.items.find(i=>i.productId===id&&i.price===p.price);if(item)item.qty++;else t.items.push({productId:id,name:p.name,price:p.price,qty:1});t.opened=t.opened||now();save();renderTables()}function qty(n,d){const t=state.tables.find(t=>t.id===selected);t.items[n].qty+=d;if(t.items[n].qty<=0)t.items.splice(n,1);if(!t.items.length)t.opened=null;save();renderTables()}function cancelOrder(){const t=state.tables.find(t=>t.id===selected);if(t.items.length&&confirm('¿Eliminar todos los consumos de '+t.name+' sin cobrar?')){t.items=[];t.opened=null;save();renderTables()}}function addTable(){openModal('Agregar mesa',field('Nombre de la mesa','name'),f=>{const name=f.get('name').trim();if(!name)throw Error('Ingresá un nombre.');state.tables.push({id:uid(),name,items:[],opened:null});save();render()})}
function checkout(){if(!requireShift())return;const t=state.tables.find(t=>t.id===selected),sum=total(t);if(!state.methods.some(m=>m.active)){alert('Agregá una forma de pago.');return}openModal('Cobrar '+esc(t.name),`<p>Total de la cuenta <b class="cyan">${money(sum)}</b></p><label>Forma de pago principal</label><select name="method">${methodOptions()}</select>${field('Importe con esta forma de pago (para dividir, ingresá una parte)','amount',sum/100,'number')}<label>Segunda forma de pago (si dividís la cuenta)</label><select name="second">${methodOptions()}</select><p class="sub">El resto se asignará automáticamente a la segunda forma de pago.</p>`,f=>{const first=amount(f.get('amount'));if(first>sum)throw Error('El importe supera el total.');const saleId=uid(),items=JSON.parse(JSON.stringify(t.items));let paymentIndex=0;for(const [methodId,value] of [[f.get('method'),first],[f.get('second'),sum-first]]){if(!value)continue;const m=state.methods.find(m=>m.id===methodId);state.movements.push({id:uid(),saleId,at:now(),shiftId:state.shift.id,type:'sale',description:t.name,amount:value,methodId:m.id,method:m.name,cash:m.cash,items:paymentIndex++===0?items:[]})}t.items=[];t.opened=null;save();selected=null;render();toast('Cobro registrado. Mesa disponible.')})}
function stats(s,opening=0){return `<div class="cards"><div class="card"><small>Ingresos cobrados</small><div class="value cyan">${money(s.income)}</div></div><div class="card"><small>Egresos</small><div class="value pink">${money(s.expense)}</div></div><div class="card"><small>Saldo de movimientos</small><div class="value">${money(s.income-s.expense)}</div></div><div class="card"><small>Efectivo esperado · con fondo inicial</small><div class="value">${money(opening+s.cash)}</div></div></div>`}
function movementTable(ms){return ms.length?`<div style="overflow:auto"><table class="list"><thead><tr><th>Fecha</th><th>Concepto</th><th>Forma de pago</th><th>Tipo</th><th class="right">Importe</th></tr></thead><tbody>${ms.slice().reverse().map(m=>`<tr><td>${date(m.at)}</td><td>${esc(m.description)}</td><td>${esc(m.method)}</td><td>${m.type==='sale'?'Venta':m.type==='income'?'Ingreso':'Egreso'}</td><td class="right ${m.type==='expense'?'pink':'cyan'}">${m.type==='expense'?'−':''}${money(m.amount)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Todavía no hay movimientos.</div>'}
function renderCash(){const ms=shiftMoves(),s=sums(ms);$('#content').innerHTML=stats(s,state.shift?.opening||0)+`<div class="row between" style="margin-bottom:22px"><div><h2>${state.shift?'Caja abierta desde '+date(state.shift.at):'Prepará una nueva jornada'}</h2>${state.shift?'<span class="sub">Fondo inicial: '+money(state.shift.opening)+'</span>':''}</div><div class="row">${state.shift?'<button onclick="manualMovement(\'income\')">＋ Ingreso</button><button onclick="manualMovement(\'expense\')">− Egreso</button><button class="primary" onclick="closeShift()">Cerrar caja</button>':'<button class="primary" onclick="openShift()">Abrir caja</button>'}</div></div><div class="panel"><h2>Movimientos de la caja actual</h2>${movementTable(ms)}</div>`}
function openShift(){openModal('Abrir caja',field('Fondo inicial en efectivo','opening',0,'number'),f=>{state.shift={id:uid(),at:now(),opening:amount(f.get('opening'),true)};save();render();toast('Caja abierta. ¡Buen servicio!')})}
function manualMovement(type){if(!requireShift())return;openModal(type==='expense'?'Registrar egreso':'Registrar ingreso',field('Concepto','description')+field('Importe','amount','','number')+`<label>Forma de pago</label><select name="method" required>${methodOptions()}</select>`,f=>{const desc=f.get('description').trim(),value=amount(f.get('amount'));if(!desc)throw Error('Ingresá un concepto.');const m=state.methods.find(m=>m.id===f.get('method'));if(!m)throw Error('Seleccioná una forma de pago.');state.movements.push({id:uid(),at:now(),shiftId:state.shift.id,type,description:desc,amount:value,methodId:m.id,method:m.name,cash:m.cash});save();render()})}
function closeShift(){if(state.tables.some(t=>t.items.length)){alert('Cobrá o cancelá las mesas pendientes antes de cerrar caja.');return}const ms=shiftMoves(),s=sums(ms),expected=state.shift.opening+s.cash;openModal('Cierre de caja',`<p>Efectivo esperado: <b>${money(expected)}</b><br>Ingresos: ${money(s.income)} · Egresos: ${money(s.expense)}</p>`+field('Efectivo contado físicamente','counted','','number')+field('Observación (podés escribir «Sin observaciones»)','note','Sin observaciones'),f=>{const counted=amount(f.get('counted'),true);state.closings.push({...state.shift,closedAt:now(),...s,expected,counted,difference:counted-expected,note:f.get('note')});state.shift=null;save();render();downloadBackup();toast('Caja cerrada. Copia de seguridad descargada.')})}
function renderProducts(){$('#content').innerHTML=`<div class="row between" style="margin-bottom:20px"><p>Precios de ejemplo en pesos argentinos. Editalos antes de comenzar.</p><button class="primary" onclick="editProduct()">＋ Nuevo producto</button></div><div class="panel"><table class="list"><thead><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Estado</th><th></th></tr></thead><tbody>${state.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${money(p.price)}</td><td>${p.active?'Disponible':'Oculto'}</td><td class="right"><button onclick="editProduct('${p.id}')">Editar</button> <button onclick="toggleProduct('${p.id}')">${p.active?'Quitar':'Activar'}</button></td></tr>`).join('')}</tbody></table></div>`}
function editProduct(id){const p=state.products.find(p=>p.id===id);openModal(p?'Editar producto':'Nuevo producto',field('Nombre','name',p?.name||'')+field('Categoría','category',p?.category||'Bebidas')+field('Precio en pesos','price',p?p.price/100:'','number'),f=>{const name=f.get('name').trim(),category=f.get('category').trim(),price=amount(f.get('price'));if(!name||!category)throw Error('Completá nombre y categoría.');if(p)Object.assign(p,{name,category,price});else state.products.push({id:uid(),name,category,price,active:true});save();render()})}function toggleProduct(id){const p=state.products.find(p=>p.id===id);p.active=!p.active;save();render()}
function renderMethods(){$('#content').innerHTML=`<div class="row between" style="margin-bottom:20px"><p>El efectivo se incluye en el arqueo de caja.</p><button class="primary" onclick="editMethod()">＋ Nueva forma de pago</button></div><div class="panel"><table class="list"><thead><tr><th>Nombre</th><th>Cuenta como efectivo</th><th>Estado</th><th></th></tr></thead><tbody>${state.methods.map(m=>`<tr><td>${esc(m.name)}</td><td>${m.cash?'Sí':'No'}</td><td>${m.active?'Activa':'Inactiva'}</td><td class="right"><button onclick="editMethod('${m.id}')">Editar</button> <button onclick="toggleMethod('${m.id}')">${m.active?'Quitar':'Activar'}</button></td></tr>`).join('')}</tbody></table></div>`}
function editMethod(id){const m=state.methods.find(m=>m.id===id);openModal(m?'Editar forma de pago':'Nueva forma de pago',field('Nombre','name',m?.name||'')+`<label>¿Es dinero físico en caja?</label><select name="cash"><option value="no">No</option><option value="yes" ${m?.cash?'selected':''}>Sí, cuenta como efectivo</option></select>`,f=>{const name=f.get('name').trim();if(!name)throw Error('Ingresá un nombre.');if(m)Object.assign(m,{name,cash:f.get('cash')==='yes'});else state.methods.push({id:uid(),name,cash:f.get('cash')==='yes',active:true});save();render()})}function toggleMethod(id){const m=state.methods.find(m=>m.id===id);if(m.active&&state.methods.filter(m=>m.active).length===1){alert('Debe quedar al menos una forma de pago activa.');return}m.active=!m.active;save();render()}
let reportFrom='',reportTo='';function filteredMoves(){return state.movements.filter(m=>{const d=new Date(m.at);const local=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');return (!reportFrom||local>=reportFrom)&&(!reportTo||local<=reportTo)})}function renderReports(){const ms=filteredMoves(),s=sums(ms);const groups={};ms.forEach(m=>{groups[m.method]=(groups[m.method]||0)+(m.type==='expense'?-1:1)*m.amount});$('#content').innerHTML=`<div class="row" style="margin-bottom:22px"><div><label>Desde</label><input type="date" value="${reportFrom}" onchange="reportFrom=this.value;renderReports()"></div><div><label>Hasta</label><input type="date" value="${reportTo}" onchange="reportTo=this.value;renderReports()"></div><button onclick="exportCSV()">Exportar movimientos CSV</button></div><div class="cards"><div class="card"><small>Ventas cobradas</small><div class="value cyan">${money(s.sales)}</div></div><div class="card"><small>Otros ingresos</small><div class="value">${money(s.income-s.sales)}</div></div><div class="card"><small>Egresos</small><div class="value pink">${money(s.expense)}</div></div><div class="card"><small>Saldo neto de movimientos</small><div class="value">${money(s.income-s.expense)}</div></div></div><div class="panel" style="margin-bottom:20px"><h2>Saldo por forma de pago</h2><div class="row">${Object.entries(groups).map(([k,v])=>`<div class="card"><small>${esc(k)}</small><div class="value">${money(v)}</div></div>`).join('')||'<p>Sin movimientos en este período.</p>'}</div><p class="sub">El saldo no incluye fondos iniciales. No representa ganancia contable.</p></div><div class="panel" style="margin-bottom:20px"><h2>Movimientos del período</h2>${movementTable(ms)}</div><div class="panel"><h2>Historial de cierres · Todas las jornadas</h2>${state.closings.length?`<div style="overflow:auto"><table class="list"><tr><th>Cierre</th><th>Ingresos</th><th>Egresos</th><th>Esperado</th><th>Contado</th><th>Diferencia</th><th>Observación</th></tr>${state.closings.slice().reverse().map(c=>`<tr><td>${date(c.closedAt)}</td><td>${money(c.income)}</td><td>${money(c.expense)}</td><td>${money(c.expected)}</td><td>${money(c.counted)}</td><td class="${c.difference?'pink':'cyan'}">${money(c.difference)}</td><td>${esc(c.note)}</td></tr>`).join('')}</table></div>`:'<p>Aún no hay cierres.</p>'}</div>`}
function download(name,body,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([body],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}function downloadBackup(){download('La-Posta-respaldo-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json',JSON.stringify(state,null,2),'application/json')}function exportCSV(){const cell=v=>'"'+String(v).replace(/^[=+@\-]/,"'").replace(/"/g,'""')+'"';const rows=[['Fecha','Tipo','Concepto','Forma de pago','Importe ARS'],...filteredMoves().map(m=>[date(m.at),m.type,m.description,m.method,((m.type==='expense'?-1:1)*m.amount/100).toFixed(2).replace('.',',')])];download('La-Posta-movimientos.csv','\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
function renderSettings(){$('#content').innerHTML=`<div class="split"><div class="panel"><h2>Copias de seguridad</h2><p>Los datos se guardan en este navegador. Para llevarlos a otra PC, exportá una copia e importala allí. Mantené siempre el archivo en la misma ubicación y usá el mismo navegador.</p><button class="primary" onclick="downloadBackup()">Descargar copia completa</button><label>Restaurar una copia (.json)</label><input id="restore" type="file" accept=".json,application/json" onchange="restoreBackup(this.files[0])"><p class="sub">Restaurar reemplaza los datos actuales. Se descargará una copia previa.</p></div><div class="panel"><h2>Administrar mesas</h2>${state.tables.map(t=>`<div class="row between" style="margin:9px 0"><span>${esc(t.name)}</span><button class="danger" onclick="removeTable('${t.id}')">Quitar</button></div>`).join('')}<button onclick="addTable()">＋ Agregar mesa</button></div></div><div class="notice">Uso en una sola PC y un solo navegador. No abras varias copias al mismo tiempo. La cuenta impresa es un comprobante interno; no emite factura fiscal.</div>`}
function validate(s){if(!s||s.version!==1)throw Error('Versión de copia no compatible.');for(const k of ['products','methods','tables','movements','closings'])if(!Array.isArray(s[k]))throw Error('Copia incompleta: '+k);const str=v=>typeof v==='string';const num=v=>Number.isSafeInteger(v)&&v>=0;const item=i=>i&&str(i.productId)&&str(i.name)&&num(i.price)&&Number.isSafeInteger(i.qty)&&i.qty>0;const uniq=a=>new Set(a.map(x=>x.id)).size===a.length;for(const k of ['products','methods','tables','movements','closings'])if(!uniq(s[k]))throw Error('Identificadores duplicados.');if(s.products.some(p=>!p||!str(p.id)||!str(p.name)||!str(p.category)||!num(p.price)||typeof p.active!=='boolean')||s.methods.some(m=>!m||!str(m.id)||!str(m.name)||typeof m.cash!=='boolean'||typeof m.active!=='boolean')||!s.methods.some(m=>m.active)||s.tables.some(t=>!t||!str(t.id)||!str(t.name)||!Array.isArray(t.items)||!t.items.every(item)))throw Error('Productos, mesas o pagos inválidos.');if(s.shift!==null&&(!s.shift||!str(s.shift.id)||!Number.isFinite(Date.parse(s.shift.at))||!num(s.shift.opening)))throw Error('Caja inválida.');if(!s.shift&&s.tables.some(t=>t.items.length))throw Error('Hay consumos sin una caja abierta.');if(s.movements.some(m=>!m||!str(m.id)||!str(m.shiftId)||!str(m.description)||!str(m.method)||!['sale','income','expense'].includes(m.type)||!num(m.amount)||typeof m.cash!=='boolean'||!Number.isFinite(Date.parse(m.at))))throw Error('Movimientos inválidos.');if(s.closings.some(c=>!c||!str(c.id)||!str(c.note)||!num(c.opening)||!num(c.income)||!num(c.expense)||!num(c.counted)||!Number.isSafeInteger(c.expected)||!Number.isSafeInteger(c.difference)||!Number.isFinite(Date.parse(c.closedAt))))throw Error('Cierres inválidos.');return s}
async function restoreBackup(file){if(!file)return;try{if(file.size>20e6)throw Error('Archivo demasiado grande.');const data=validate(JSON.parse(await file.text()));if(!confirm('¿Reemplazar todos los datos con esta copia? Se descargará un respaldo de los datos actuales.'))return;downloadBackup();const previous=state;state=data;if(!save()){state=previous;return}selected=null;render();toast('Copia restaurada correctamente.')}catch(e){alert('No se pudo restaurar: '+e.message)}finally{if($('#restore'))$('#restore').value=''}}function removeTable(id){const t=state.tables.find(t=>t.id===id);if(t.items.length){alert('La mesa tiene consumos pendientes.');return}if(confirm('¿Quitar '+t.name+'?')){state.tables=state.tables.filter(t=>t.id!==id);save();render()}}
function printOrder(){const t=state.tables.find(t=>t.id===selected);const w=window.open('','_blank','width=420,height=650');if(!w){alert('Permití ventanas emergentes para imprimir.');return}w.document.write(`<html lang="es"><title>Cuenta · La Posta Bar</title><body style="font:14px monospace;max-width:340px;margin:25px auto"><h1>LA POSTA BAR</h1><p>${esc(t.name)} · ${date(now())}</p><hr>${t.items.map(i=>`<p>${i.qty} × ${esc(i.name)}<br>${money(i.price*i.qty)}</p>`).join('')}<hr><h2>TOTAL ${money(total(t))}</h2><p>¡Gracias por venir!</p><p>Comprobante interno. No válido como factura.</p></body></html>`);w.document.close();w.focus();w.print()}
window.addEventListener('storage',e=>{if(e.key===KEY){alert('Se modificaron datos en otra ventana. Esta ventana se actualizará para evitar usar datos anteriores.');location.reload()}});save();render();
</script></html>
